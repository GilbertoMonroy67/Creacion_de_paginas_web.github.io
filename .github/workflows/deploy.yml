name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Descargar el código fuente del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Paso 2: Configurar pnpm indicando la versión 9
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Paso 3: Configurar Node.js (versión 22) sin la caché anticipada
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Paso 4: Instalar las dependencias del proyecto
      - name: Install dependencies
        run: pnpm install

      # Paso 5: Compilar el sitio estático de Next.js (genera la carpeta /out)
      - name: Build static site
        run: pnpm build

      # Paso 6: Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Paso 7: Empaquetar la carpeta /out generada
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      # Paso 8: Publicar en GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4